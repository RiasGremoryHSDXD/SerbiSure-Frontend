name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release?'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Custom tag (e.g. v0.1.8, leave blank to use package.json version)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Node dependencies
        run: npm ci

      - name: Determine App Version & Release Tag
        id: version_info
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${PACKAGE_VERSION}"
          fi

          echo "APP_VERSION=${PACKAGE_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Resolved Version: ${PACKAGE_VERSION}"
          echo "Resolved Tag: ${TAG}"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APKs
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease -x lint -x test --no-daemon

      - name: Prepare and Label Release APK Artifacts
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          OUTPUT_DIR="dist/apks"
          mkdir -p "$OUTPUT_DIR"

          # Copy and rename for clear branding and architecture identification
          if [ -f "$RELEASE_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$RELEASE_DIR/app-arm64-v8a-release.apk" "$OUTPUT_DIR/SerbiSure-v${APP_VERSION}-arm64-v8a.apk"
          fi

          if [ -f "$RELEASE_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$RELEASE_DIR/app-armeabi-v7a-release.apk" "$OUTPUT_DIR/SerbiSure-v${APP_VERSION}-armeabi-v7a.apk"
          fi

          if [ -f "$RELEASE_DIR/app-universal-release.apk" ]; then
            cp "$RELEASE_DIR/app-universal-release.apk" "$OUTPUT_DIR/SerbiSure-v${APP_VERSION}-universal.apk"
          fi

          # Fallback if standard release APK was built without splits
          if [ -f "$RELEASE_DIR/app-release.apk" ]; then
            cp "$RELEASE_DIR/app-release.apk" "$OUTPUT_DIR/SerbiSure-v${APP_VERSION}.apk"
          fi

          echo "Generated APK files:"
          ls -lh "$OUTPUT_DIR"

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerbiSure-v${{ env.APP_VERSION }}-APKs
          path: dist/apks/*.apk
          retention-days: 14

      - name: Create GitHub Release with Release Notes
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SerbiSure Release ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: dist/apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
